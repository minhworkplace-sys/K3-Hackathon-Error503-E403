<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Study Companion</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary": "#ffffff",
              "surface-container-low": "#f2f4f6",
              "inverse-surface": "#2d3133",
              "surface-tint": "#3d5ca2",
              "on-secondary-container": "#6c4d00",
              "surface-container-highest": "#e0e3e5",
              primary: "#001a48",
              surface: "#f7f9fb",
              outline: "#747782",
              "on-tertiary-fixed-variant": "#004d62",
              secondary: "#7c5800",
              "secondary-container": "#febb21",
              "on-tertiary-fixed": "#001f29",
              "tertiary-fixed-dim": "#5cd4ff",
              "primary-fixed": "#dae2ff",
              "on-tertiary-container": "#00a6d0",
              "on-secondary-fixed": "#271900",
              "on-primary-container": "#7a97e2",
              "outline-variant": "#c4c6d2",
              "surface-variant": "#e0e3e5",
              "primary-container": "#002d72",
              "surface-bright": "#f7f9fb",
              "on-error-container": "#93000a",
              error: "#ba1a1a",
              "inverse-on-surface": "#eff1f3",
              "inverse-primary": "#b1c5ff",
              "surface-container-lowest": "#ffffff",
              "on-primary-fixed-variant": "#224489",
              "primary-fixed-dim": "#b1c5ff",
              "on-primary-fixed": "#001946",
              "on-surface-variant": "#444651",
              "on-background": "#191c1e",
              "on-error": "#ffffff",
              "secondary-fixed": "#ffdea6",
              "secondary-fixed-dim": "#febb21",
              "surface-container": "#eceef0",
              "on-secondary-fixed-variant": "#5e4200",
              "surface-container-high": "#e6e8ea",
              "on-surface": "#191c1e",
              "tertiary-container": "#003646",
              "surface-dim": "#d8dadc",
              "tertiary-fixed": "#baeaff",
              "error-container": "#ffdad6",
              "on-secondary": "#ffffff",
              "on-primary": "#ffffff",
              background: "#f7f9fb",
              tertiary: "#00202a",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "8px",
              xl: "12px",
              full: "9999px",
            },
            spacing: {
              "stack-sm": "0.5rem",
              "stack-md": "1rem",
              gutter: "1.5rem",
              "chat-width": "360px",
              "sidebar-width": "280px",
              "container-max": "1440px",
              "margin-page": "2rem",
            },
            fontFamily: {
              "body-sm": ["Inter"],
              "headline-md": ["Manrope"],
              "headline-lg": ["Manrope"],
              "headline-sm": ["Manrope"],
              "label-sm": ["Inter"],
              "label-bold": ["Inter"],
              "body-lg": ["Inter"],
              "body-md": ["Inter"],
            },
            fontSize: {
              "body-sm": ["13px", { lineHeight: "20px", fontWeight: "400" }],
              "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
              "headline-lg": [
                "32px",
                { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" },
              ],
              "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }],
              "label-sm": ["11px", { lineHeight: "14px", fontWeight: "500" }],
              "label-bold": ["12px", { lineHeight: "16px", fontWeight: "600" }],
              "body-lg": ["16px", { lineHeight: "26px", fontWeight: "400" }],
              "body-md": ["14px", { lineHeight: "22px", fontWeight: "400" }],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
      }

      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        vertical-align: middle;
      }

      .active-tab-shadow {
        box-shadow: 0 4px 12px rgba(0, 45, 114, 0.08);
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }

      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }

      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #c4c6d2;
        border-radius: 10px;
      }
    </style>
  </head>
  <body class="bg-background text-on-background">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
